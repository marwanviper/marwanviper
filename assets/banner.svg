<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Marwan Abbas - AI and LLM Systems, Computer Vision, Full-Stack Python and .NET">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#glowRight)" />

  <!-- Subtle Geometric / Neural Constellation Accents -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="88" y1="68" x2="152" y2="106" />
    <line x1="152" y1="106" x2="108" y2="172" />
    <line x1="152" y1="106" x2="218" y2="82" />
    <line x1="1040" y1="62" x2="1104" y2="112" />
    <line x1="1104" y1="112" x2="1018" y2="168" />
    <line x1="1040" y1="62" x2="972" y2="96" />
  </g>
  <g fill="#38BDF8" fill-opacity="0.45">
    <circle cx="88" cy="68" r="3.5" />
    <circle cx="152" cy="106" r="4.5" />
    <circle cx="108" cy="172" r="3" />
    <circle cx="218" cy="82" r="3" />
    <circle cx="1040" cy="62" r="4" />
    <circle cx="1104" cy="112" r="4.5" />
    <circle cx="1018" cy="168" r="3.5" />
    <circle cx="972" cy="96" r="3" />
  </g>

  <!-- Main Title -->
  <text x="600" y="102" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1.2">
    Marwan Abbas
  </text>

  <!-- Accent Divider -->
  <rect x="330" y="122" width="540" height="2.5" rx="1.25" fill="url(#accentLine)" />

  <!-- Primary Tagline -->
  <text x="600" y="158" text-anchor="middle" fill="#7DD3FC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.6">
    AI &amp; LLM Systems   •   Computer Vision   •   Full-Stack Python &amp; .NET
  </text>

  <!-- Secondary Affiliation Line -->
  <text x="600" y="192" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.4">
    Communication &amp; Electronics Engineering @ Alexandria University
  </text>
</svg>
